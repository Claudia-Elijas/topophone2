# ================================= #
# ................................. #
# Configuration file for TopoPhone2 #
# ................................. #
# ================================= # 

# =============================== #
# data section                    #
# =============================== #
# signal_data_path: Path to the text file containing signal data.
# noise_data_path (optional): Path to the text file containing noise data.
[data]
signal_data_path = ./data_1/data_input.txt
#noise_data_path = ./data_1/noise_data_input.txt

# =============================== #
# signal_model section            #
# =============================== #
# sensor_positions: Path to the CSV file containing sensor positions [m].
# angular_freq: Path to the CSV file containing angular frequencies [rad.s-1].
# signals: Comma-separated list of signal types (e.g., point, skewnormal).
# weight_units: Units for weighting (e.g., dB, linear).
[signal_model]
signals = normal, normal, point
weight_units = dB

# =============================== #
# noise_model section             #
# =============================== #
# signal_noise: Type of noise model (e.g., isonoise, noise2D, noise3D).
# dim (optional): Dimensions of the ISOTROPIC noise model (e.g., 2, 3).
# s (optional): local slowness [s.m-1] (float).
# a (optional): list of cosine coefficients [-].
# b (optional): list of sine coefficients [-].
# max_order (optional): max order of harmonic basis if 'a' and 'b' are NOT specified.
# sensor_selfnoise: whether to account for sensor self-noise (True or False).
[noise_model] 
signal_noise = noise3D
#dim = 1
s = 2.1
a = 0.5, 0.2 
b = 0.5, 0.3
#max_order = 10
sensor_selfnoise = False

# =============================== #
# prior_pdf section               #
# =============================== #
# bounds: Path to the CSV file containing prior bounds for the parameters.
[prior_pdf]
bounds = ./data_1/prior_bounds.csv

# =============================== #
# inversion section               #
# =============================== #
# n_flows: Number of normalizing flows.
# mean_field: Whether to use mean field approximation (e.g., True, False).
# initial_distr: Initial distribution for the inversion (e.g., Uniform).
# learning_rate: Learning rate for the inversion (float).
# iterations: Number of iterations for the inversion (int).
# n_sample: Number of samples for the inversion (int).
# inversion_n_out: Number of output samples for the inversion (int).
# verbose: Whether to print verbose output during the inversion (e.g., True, False).
# posterior_samples: Number of posterior samples to generate (int).
[inversion]
n_flows = 4 
mean_field = False
initial_distr = Uniform 
learning_rate = 0.001 
iterations = 1000 
n_sample = 1000
inversion_n_out = 20
verbose = True 
posterior_samples = 1000  

# =============================== #
# save_out section                #
# =============================== #
# inversion_outpath (optional): Path to save the inversion output.
# model_outpath: Path to save the model output.
# loss_outpath (optional): Path to save the loss output.
[save_out]
#inversion_outpath = ./output/flowinv_out
model_outpath = ./output/model_out
loss_outpath = ./output/loss_out
